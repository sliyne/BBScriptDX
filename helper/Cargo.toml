[package]
name = "bbscript-helper"
version = "0.1.0"
edition = "2021"

[features]
old-cfg-converter = []

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ron = "0.8"
bimap = { version = "0.6", features = ["serde"] }
byteorder = "1.3"
bytes = "1.0"
hex = "0.4"
pest_derive = "2.1"
pest_consume = "1.0"
pest = "2.1"
smallvec = { version = "1.8", features = ["serde"] }
log = "0.4"
flate2 = "1.0"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
num_cpus = "1"
sha1 = "0.10"
aes = "0.7"
clap = "2.34"

[dev-dependencies]
walkdir = "2"